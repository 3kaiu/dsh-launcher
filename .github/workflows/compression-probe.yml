name: compression-probe
on:
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14-arm64, macos-26-arm64]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: build stage
        run: node scripts/release.ts ci
      - name: probe compression
        run: |
          SRC="dist/stage/DeepSeek Harness.app"
          du -sh "$SRC"
          for spec in "UDZO zlib-level=9" "UDZO zlib-level=6" "ULFO"; do
            FMT="${spec%% *}"; KEY="${spec#* }"
            ARGS=()
            [ "$KEY" != "$FMT" ] && ARGS=(-imagekey "$KEY")
            hdiutil create -volname p -srcfolder "$SRC" -ov -format "$FMT" "${ARGS[@]}" /tmp/p.dmg
            echo "RESULT ${{ matrix.os }} $FMT $KEY: $(stat -f%z /tmp/p.dmg) bytes"
            rm -f /tmp/p.dmg
          done