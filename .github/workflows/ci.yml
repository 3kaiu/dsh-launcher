name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 类型检查 + 单测 (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 依赖(devDeps + typescript)
        run: |
          npm ci
          npm i -g typescript@^5.6
      - name: TS 类型检查
        run: tsc --noEmit
      - name: 单测(node --test,原生 TS)
        run: node --test test/versions.test.mjs

  integration:
    name: 集成冒烟(便携包真实安装上游最新 node + dsh)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 构建 stage 供冒烟(ci 模式:跳过 dmg 打包,避免与 Release 重复构建)
        run: |
          brew install librsvg
          node scripts/release.ts ci
      - name: 冒烟测试(动态版本:node 最新 LTS + dsh latest)
        run: bash scripts/smoke-test.sh dist/stage/dshctl

