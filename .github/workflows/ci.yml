name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: bash 语法检查
        run: bash -n dshctl scripts/*.sh
      - name: shellcheck
        run: shellcheck dshctl scripts/*.sh

  integration:
    name: 集成冒烟(真实安装 Node + dsh)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 冒烟测试
        run: bash scripts/smoke-test.sh

  build-app:
    name: 构建菜单栏 App
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: 构建发布包
        run: bash scripts/build-app.sh ci
      - name: 校验 .app 产物
        run: |
          test -d "dist/dsh-launcher-macos-ci/DeepSeek Harness Launcher.app"
          test -x "dist/dsh-launcher-macos-ci/DeepSeek Harness Launcher.app/Contents/MacOS/DShLauncher"
          test -f "dist/dsh-launcher-macos-ci.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-launcher-macos-ci
          path: dist/
