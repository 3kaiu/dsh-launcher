name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: 构建发行包(dmg 双击版 + 命令行版)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 构建(TS 源码 + App + dmg + zip,零构建期依赖)
        run: node scripts/release.ts "${GITHUB_REF_NAME#v}"
      - name: 发布到 GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          VER="${GITHUB_REF_NAME#v}"
          gh release create "${{ github.ref_name }}" \
            "dsh-launcher-$VER.dmg" "dshctl-$VER.zip" SHA256SUMS.txt VERSIONS.txt \
            --title "dsh-launcher ${{ github.ref_name }}" \
            --generate-notes \
            || gh release upload "${{ github.ref_name }}" \
              "dsh-launcher-$VER.dmg" "dshctl-$VER.zip" SHA256SUMS.txt VERSIONS.txt --clobber

