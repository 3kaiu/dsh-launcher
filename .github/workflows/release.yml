name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: 构建发行包(install.sh + 预编译 daemon)
    # 仅编译 daemon.c + zip,不依赖 hdiutil/macos-14 镜像;macos-latest 队列更宽裕
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: 编译守护(arm64,ad-hoc 签名)
        run: clang -O2 -Wall -Wextra -o /tmp/daemon src/daemon.c && codesign --force -s - /tmp/daemon
      - name: 生成 package-lock.json(预解析依赖树,用户安装跳过解析省 30~60s)
        run: |
          LATEST=$(npm view @deepseek-ai/dsh version 2>/dev/null || echo "latest")
          mkdir -p /tmp/dsh-lock
          echo '{"dependencies":{"@deepseek-ai/dsh":"'$LATEST'"}}' > /tmp/dsh-lock/package.json
          cd /tmp/dsh-lock && npm install --package-lock-only --no-audit --no-fund --loglevel=error
          mkdir -p /tmp/pkg
          cp /tmp/dsh-lock/package-lock.json /tmp/pkg/package-lock.json
      - name: 打包(install.sh + daemon + daemon.c + plist + lock)
        run: |
          mkdir -p /tmp/pkg/launchd
          cp /tmp/daemon /tmp/pkg/daemon
          cp scripts/install.sh /tmp/pkg/install.sh
          cp src/daemon.c /tmp/pkg/daemon.c
          cp launchd/com.dshpwa.daemon.plist /tmp/pkg/launchd/
          cd /tmp/pkg && zip -qr dsh-pwa.zip .
      - name: 发布到 GitHub Releases(下载链接)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" /tmp/pkg/dsh-pwa.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "dsh-pwa ${{ github.ref_name }}" \
            --notes-file "$GITHUB_WORKSPACE/.github/RELEASE_NOTES.md" \
            || gh release upload "${{ github.ref_name }}" /tmp/pkg/dsh-pwa.zip --repo "$GITHUB_REPOSITORY" --clobber