name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: 构建发行包(install.sh + 预编译 daemon)
    # 仅编译 daemon.c + zip,不依赖 hdiutil/macos-14 镜像;macos-latest 队列更宽裕
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 编译守护(arm64,ad-hoc 签名)
        run: clang -O2 -Wall -Wextra -o /tmp/daemon src/daemon.c && codesign --force -s - /tmp/daemon
      - name: 打包(install.sh + daemon + daemon.c + plist)
        run: |
          mkdir -p /tmp/pkg/launchd
          cp /tmp/daemon /tmp/pkg/daemon
          cp scripts/install.sh /tmp/pkg/install.sh
          cp src/daemon.c /tmp/pkg/daemon.c
          cp launchd/com.dshlauncher.daemon.plist /tmp/pkg/launchd/
          cd /tmp/pkg && zip -qr dsh-launcher.zip .
      - name: 发布到 GitHub Releases(下载链接)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" /tmp/pkg/dsh-launcher.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "dsh-launcher ${{ github.ref_name }}" \
            --notes-file "$GITHUB_WORKSPACE/.github/RELEASE_NOTES.md" \
            || gh release upload "${{ github.ref_name }}" /tmp/pkg/dsh-launcher.zip --repo "$GITHUB_REPOSITORY" --clobber