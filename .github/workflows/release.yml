name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: 构建轻量发行包(不含运行时,零构建依赖)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 构建(TS 源码 + 启动器,~10KB)
        run: node scripts/release.ts "${{ github.ref_name }}#v"
      - name: 发布到 GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          VER="${{ github.ref_name }}#v"
          ZIP="dshctl-$VER.zip"
          gh release create "${{ github.ref_name }}" "$ZIP" SHA256SUMS.txt VERSIONS.txt \
            --title "dshctl ${{ github.ref_name }}" \
            --generate-notes \
            || gh release upload "${{ github.ref_name }}" "$ZIP" SHA256SUMS.txt VERSIONS.txt --clobber

